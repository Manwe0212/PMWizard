name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pmwizard
          POSTGRES_USER: pmwizard
          POSTGRES_PASSWORD: pmwizard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmwizard -d pmwizard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PMWIZARD_DATABASE_URL: postgresql+psycopg://pmwizard:pmwizard@localhost:5432/pmwizard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
