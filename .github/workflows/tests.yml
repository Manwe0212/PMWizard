name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pmwizard
          POSTGRES_USER: pmwizard
          POSTGRES_PASSWORD: pmwizard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmwizard -d pmwizard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PMWIZARD_DATABASE_URL: postgresql+psycopg://pmwizard:pmwizard@localhost:5432/pmwizard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q


  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Lint web
        run: npm run lint

      - name: Build web
        run: npm run build


  demo-stack:
    name: docker-demo-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for demo bootstrap and smoke script
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate temporary, private demo credentials
        env:
          PMWIZARD_DEMO_QUIET: "1"
        run: python scripts/init_demo_env.py

      - name: Validate isolated Compose configuration
        run: docker compose --env-file .env.demo -f compose.demo.yml config --quiet

      - name: Build and start database, migrations, seed, API and web
        run: docker compose --env-file .env.demo -f compose.demo.yml up --build -d --wait

      - name: Smoke test authenticated local demo
        run: python scripts/smoke_demo_stack.py

      - name: Run synthetic end-to-end MVP UAT (18 API + web acceptance steps)
        run: python scripts/uat_demo_stack.py --output reports/uat/automated.json

      - name: Verify automated UAT evidence is complete but never human-approved
        run: python scripts/evaluate_mvp_release.py --automated reports/uat/automated.json --automated-only

      - name: Preserve sanitized automated UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmwizard-synthetic-uat-${{ github.run_id }}
          path: reports/uat/automated.json
          if-no-files-found: warn
          retention-days: 30

      - name: Diagnose demo containers on failure
        if: failure()
        run: |
          docker compose --env-file .env.demo -f compose.demo.yml ps -a
          docker compose --env-file .env.demo -f compose.demo.yml logs --no-color --tail=100

      - name: Remove ephemeral demo data and containers
        if: always()
        run: |
          if test -f .env.demo; then
            docker compose --env-file .env.demo -f compose.demo.yml down --volumes --remove-orphans
          fi


  staging-config:
    name: staging-private-config-and-web-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Synthetic CI-only values; this job never starts SMTP or staging DB.
      PMWIZARD_DB_USER: ci_private
      PMWIZARD_DB_PASSWORD: FakeCIOnlyPasswordNotForDeployment2026
      PMWIZARD_DB_NAME: ci_private
      PMWIZARD_STAGING_DATABASE_URL: postgresql+psycopg://ci_private:FakeCIOnlyPasswordNotForDeployment2026@stage-db:5432/ci_private
      PMWIZARD_AUTH_SECRET: CiOnly_64_characters_not_a_deployment_secret_ABCDEFGHIJKLMNOPQRSTUVWXYZ
      PMWIZARD_PUBLIC_BASE_URL: https://staging.example.org
      PMWIZARD_NOTIFICATION_SMTP_HOST: smtp.example.org
      PMWIZARD_NOTIFICATION_EMAIL_FROM: ci@example.org
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify staging Compose has no exposed DB or API and no demo seeder
        run: |
          docker compose -f compose.staging.yml config --quiet
          python - <<'PY'
          import json
          import subprocess
          raw = subprocess.check_output(
              ["docker", "compose", "-f", "compose.staging.yml", "config", "--format", "json"],
              text=True,
          )
          services = json.loads(raw)["services"]
          assert set(services) == {"stage-db", "stage-migrate", "stage-api", "stage-web"}
          for name in ("stage-db", "stage-migrate", "stage-api"):
              assert not services[name].get("ports"), name
          ports = services["stage-web"]["ports"]
          assert len(ports) == 1
          assert ports[0].get("host_ip") == "127.0.0.1"
          assert str(ports[0].get("published")) == "3000"
          assert services["stage-api"]["environment"]["PMWIZARD_ENV"] == "staging"
          PY

      - name: Build unprivileged production-mode Next.js staging image
        run: docker build -f web/Dockerfile.staging -t pmwizard-web-staging-ci ./web
