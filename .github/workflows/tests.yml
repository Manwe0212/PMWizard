name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pmwizard
          POSTGRES_USER: pmwizard
          POSTGRES_PASSWORD: pmwizard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmwizard -d pmwizard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PMWIZARD_DATABASE_URL: postgresql+psycopg://pmwizard:pmwizard@localhost:5432/pmwizard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q


  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Lint web
        run: npm run lint

      - name: Build web
        run: npm run build


  demo-stack:
    name: docker-demo-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for demo bootstrap and smoke script
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate temporary, private demo credentials
        env:
          PMWIZARD_DEMO_QUIET: "1"
        run: python scripts/init_demo_env.py

      - name: Validate isolated Compose configuration
        run: docker compose --env-file .env.demo -f compose.demo.yml config --quiet

      - name: Build and start database, migrations, seed, API and web
        run: docker compose --env-file .env.demo -f compose.demo.yml up --build -d --wait

      - name: Smoke test authenticated local demo
        run: python scripts/smoke_demo_stack.py

      - name: Diagnose demo containers on failure
        if: failure()
        run: |
          docker compose --env-file .env.demo -f compose.demo.yml ps -a
          docker compose --env-file .env.demo -f compose.demo.yml logs --no-color --tail=100

      - name: Remove ephemeral demo data and containers
        if: always()
        run: |
          if test -f .env.demo; then
            docker compose --env-file .env.demo -f compose.demo.yml down --volumes --remove-orphans
          fi
